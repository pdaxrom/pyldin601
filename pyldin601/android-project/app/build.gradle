plugins {
    id 'com.android.application'
}

def repoRoot = rootProject.projectDir.parentFile.parentFile
def legacyRoot = repoRoot?.parentFile

def resolveVersionName = {
    def versionFile = repoRoot ? new File(repoRoot, "VERSION") : null
    if (versionFile?.exists()) {
        return versionFile.text.trim()
    }
    return "0.0.0"
}

android {
    namespace "com.pdaxrom.pyldin601"
    compileSdk 33

    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.pdaxrom.pyldin601"
        minSdk 28
        targetSdk 33
        versionCode 3
        versionName resolveVersionName()

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments "-DVCPKG_ROOT=/Users/sash/Work/vcpkg"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("../jni/CMakeLists.txt")
        }
    }

    buildTypes {
        debug {
            ndk {
                // mirrors previous NDK_DEBUG=1 behaviour
                debuggable true
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            excludes += [
                    "META-INF/**",
            ]
        }
    }

    def generatedAssetsDir = layout.buildDirectory.dir("generated/assets/main")

    tasks.register("prepareAssets", Copy) {
        into generatedAssetsDir

        if (legacyRoot) {
            def romSource = new File(legacyRoot, "native/RAMROMDiskPipnet")
            if (romSource.exists()) {
                from(romSource) {
                    include "rom*.roz"
                    into "Rom"
                }
            }

            def biosSource = new File(legacyRoot, "native/Bios")
            if (biosSource.exists()) {
                from(biosSource) {
                    into "Bios"
                }
            }
        }

        if (repoRoot) {
            def shadersSource = new File(repoRoot, "shaders")
            if (shadersSource.exists()) {
                from(shadersSource) {
                    into "shaders"
                }
            }
        }
    }

    applicationVariants.configureEach { variant ->
        variant.mergeAssetsProvider.configure { dependsOn(tasks.named("prepareAssets")) }
    }

    sourceSets {
        main {
            assets.srcDir generatedAssetsDir
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
}
