plugins {
    id 'com.android.application'
}

def sourceRoot = rootProject.projectDir.parentFile
def dataRoot = sourceRoot?.parentFile

def resolveVersionName = {
    def versionFile = sourceRoot ? new File(sourceRoot, "VERSION") : null
    if (versionFile?.exists()) {
        return versionFile.text.trim()
    }
    return "0.0.0"
}

android {
    namespace "com.pdaxrom.pyldin601"
    compileSdk 33

    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.pdaxrom.pyldin601"
        minSdk 28
        targetSdk 33
        versionCode 3
        versionName resolveVersionName()

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments "-DVCPKG_ROOT=/Users/sash/Work/vcpkg"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("../jni/CMakeLists.txt")
        }
    }

    buildTypes {
        debug {
            ndk {
                // mirrors previous NDK_DEBUG=1 behaviour
                debuggable true
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            excludes += [
                    "META-INF/**",
            ]
        }
    }

    def generatedAssetsDir = layout.buildDirectory.dir("generated/assets/main")

    tasks.register("prepareAssets", Copy) {
        into generatedAssetsDir

        doFirst {
            delete generatedAssetsDir
        }

        if (dataRoot) {
            def nativeSource = new File(dataRoot, "native")
            def hd6303Source = new File(dataRoot, "native-hd6303/Hd6303")

            def biosSource = new File(nativeSource, "Bios")
            if (biosSource.exists()) {
                from(biosSource) {
                    into "Bios"
                }
            }

            def romSource = new File(nativeSource, "RAMROMDiskPipnet")
            if (romSource.exists()) {
                from(romSource) {
                    include "*.roz"
                    into "Rom"
                }
            }

            def romPagesSource = new File(nativeSource, "Rom")
            if (romPagesSource.exists()) {
                from(romPagesSource) {
                    include "*.roz"
                    into "Rom"
                }
            }

            def floppySource = new File(nativeSource, "Floppy")
            if (floppySource.exists()) {
                from(floppySource) {
                    include "*.imz"
                    into "Floppy"
                }
            }

            if (hd6303Source.exists()) {
                from(hd6303Source) {
                    exclude "SD/lil601.img.gz"
                    into "Hd6303"
                }

                def hd6303SdSource = new File(hd6303Source, "SD/lil601.img.gz")
                if (hd6303SdSource.exists()) {
                    from(hd6303SdSource) {
                        rename { "lil601.img.gz.asset" }
                        into "Hd6303/SD"
                    }
                }
            }
        }

    }

    applicationVariants.configureEach { variant ->
        variant.mergeAssetsProvider.configure { dependsOn(tasks.named("prepareAssets")) }
    }

    sourceSets {
        main {
            assets.srcDirs = [generatedAssetsDir.get().asFile]
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
}
